<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>键盘控制移动</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        #trigger-video {
            position: fixed;
            height: 33%;
            width: auto;
            aspect-ratio: 1/1;
            top: 23.6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            display: none;
            object-fit: cover;
        }
        #line-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        #man-img { position: fixed; width: 6%; z-index: 10; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; z-index: 100; }
        
        /* 触发按钮样式 */
        .trigger-btn {
            position: fixed;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0);
            border: none;
            cursor: pointer;
            z-index: 3;
            transform: translate(-50%, -50%);
        }
        .trigger-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .trigger-btn.active {
            background: rgba(255, 0, 0, 0.5);
        }
        
        /* 右下角调节面板 */
        #mini-panel {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 200px;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            padding: 15px;
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
        }
        #mini-panel h4 {
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            font-size: 13px;
        }
        .mini-control {
            margin-bottom: 10px;
        }
        .mini-control label {
            display: block;
            margin-bottom: 3px;
        }
        .mini-control input[type="range"] {
            width: 100%;
        }
        .mini-value {
            font-size: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <video id="bg-video" style="width:100%;height:100%"></video>
    <canvas id="line-canvas"></canvas>
    <img src="white%20man.png_tmp" id="man-img">
    <div id="status">加载视频中...</div>
    
    <!-- 触发按钮容器 -->
    <div id="trigger-buttons"></div>
    
    <!-- 1号按钮触发视频 -->
    <video id="trigger-video" loop muted></video>
    
    <!-- 右下角调节面板 -->
    <div id="mini-panel">
        <h4>调节面板</h4>
        
        <div class="mini-control">
            <label>线条粗细</label>
            <input type="range" id="mini-line-width" min="1" max="10" value="3">
            <span class="mini-value" id="mini-line-width-val">3px</span>
        </div>
        
        <div class="mini-control">
            <label>视频大小</label>
            <input type="range" id="mini-video-size" min="10" max="80" value="33">
            <span class="mini-value" id="mini-video-size-val">33%</span>
        </div>
        
        <div class="mini-control">
            <label>视频垂直位置</label>
            <input type="range" id="mini-video-top" min="0" max="80" value="23.6">
            <span class="mini-value" id="mini-video-top-val">23.6%</span>
        </div>
    </div>
    
    <script>
        const manImg = document.getElementById('man-img');
        const status = document.getElementById('status');
        const bgVideo = document.getElementById('bg-video');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        // 设置canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawLine();
        }

        // 加载视频
        bgVideo.src = 'bg.mp4';
        bgVideo.loop = true;
        bgVideo.muted = true;

        bgVideo.oncanplay = function() {
            status.textContent = '视频已加载，点击开启声音';
            bgVideo.play().catch(e => console.log('播放失败:', e));
        };

        bgVideo.onerror = function() {
            status.textContent = '视频加载失败，尝试mov格式';
            bgVideo.src = 'bg.mov';
        };

        document.addEventListener('click', function() {
            bgVideo.muted = false;
            bgVideo.volume = 1;
            status.textContent = '声音已开启';
        });

        // 路径点数组
        const basePathPoints = [
            {x: 0.02, y: 0.50},
            {x: 0.04, y: 0.46},
            {x: 0.06, y: 0.42},
            {x: 0.08, y: 0.40},
            {x: 0.10, y: 0.42},
            {x: 0.12, y: 0.46},
            {x: 0.14, y: 0.52},
            {x: 0.16, y: 0.58},
            {x: 0.18, y: 0.62},
            {x: 0.20, y: 0.60},
            {x: 0.22, y: 0.54},
            {x: 0.24, y: 0.48},
            {x: 0.26, y: 0.42},
            {x: 0.28, y: 0.38},
            {x: 0.30, y: 0.40},
            {x: 0.32, y: 0.46},
            {x: 0.34, y: 0.54},
            {x: 0.36, y: 0.62},
            {x: 0.38, y: 0.68},
            {x: 0.40, y: 0.66},
            {x: 0.42, y: 0.58},
            {x: 0.44, y: 0.50},
            {x: 0.46, y: 0.42},
            {x: 0.48, y: 0.36},
            {x: 0.50, y: 0.38},
            {x: 0.52, y: 0.44},
            {x: 0.54, y: 0.52},
            {x: 0.56, y: 0.60},
            {x: 0.58, y: 0.66},
            {x: 0.60, y: 0.64},
            {x: 0.62, y: 0.56},
            {x: 0.64, y: 0.48},
            {x: 0.66, y: 0.42},
            {x: 0.68, y: 0.40},
            {x: 0.70, y: 0.44},
            {x: 0.72, y: 0.50},
            {x: 0.74, y: 0.56},
            {x: 0.76, y: 0.58},
            {x: 0.78, y: 0.56},
            {x: 0.80, y: 0.52},
            {x: 0.82, y: 0.48},
            {x: 0.84, y: 0.46},
            {x: 0.86, y: 0.48},
            {x: 0.88, y: 0.50},
            {x: 0.90, y: 0.52},
            {x: 0.92, y: 0.52},
            {x: 0.94, y: 0.50},
            {x: 0.96, y: 0.48},
            {x: 0.98, y: 0.50}
        ];

        // 当前配置
        let config = {
            lineColor: '#ffffff',
            lineWidth: 3,
            manSize: 6,
            speed: 0.02,
            lineOffset: 0,
            lineSlope: 0,
            lineScale: 100
        };

        // 获取带变换的路径点
        function getPathPoints() {
            const offset = config.lineOffset * 0.01;
            const slope = config.lineSlope * 0.01; // 坡度因子
            const scale = config.lineScale / 100; // 缩放比例
            
            // 计算中心点用于缩放
            const centerY = 0.5;
            
            return basePathPoints.map(p => {
                // 先应用缩放
                let y = centerY + (p.y - centerY) * scale;
                // 再应用坡度（x越大，y变化越大）
                y += p.x * slope;
                // 最后应用垂直偏移
                y += offset;
                
                return {
                    x: p.x,
                    y: y
                };
            });
        }

        // 绘制白线
        function drawLine() {
            const pathPoints = getPathPoints();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = config.lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            for (let i = 0; i < pathPoints.length; i++) {
                const x = pathPoints[i].x * canvas.width;
                const y = pathPoints[i].y * canvas.height;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        // 获取路径上某位置的坐标
        function getPositionOnPath(index) {
            const pathPoints = getPathPoints();
            const i = Math.max(0, Math.min(pathPoints.length - 1, Math.floor(index)));
            const nextI = Math.min(pathPoints.length - 1, i + 1);
            const t = index - i;
            
            const p1 = pathPoints[i];
            const p2 = pathPoints[nextI];
            
            return {
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            };
        }

        let pathIndex = 0;
        const keys = { w: false, a: false, s: false, d: false };
        
        // 1号按钮视频触发相关
        const triggerVideo = document.getElementById('trigger-video');
        let isTriggerVideoPlaying = false;
        let canTriggerButton1 = false; // 是否可以触发1号按钮
        let videoState = 0; // 0: 未播放, 1: 播放a视频, 2: 播放b视频
        let isLongPressingB = false; // 是否正在长按播放b视频
        let videoBCurrentTime = 0; // 记录B视频上次播放的中断位置
        
        // 创建48个触发按钮
        const triggerButtonsContainer = document.getElementById('trigger-buttons');
        const buttonRanges = [];
        
        // 生成按钮范围：0号(0-0.5), 1号(0.5-1.5), 2号(1.5-2.5)... 47号(46.5-47.5)
        for (let i = 0; i < 48; i++) {
            let min, max;
            if (i === 0) {
                min = 0;
                max = 0.5;
            } else {
                min = i - 0.5;
                max = i + 0.5;
            }
            buttonRanges.push({ min, max, id: i });
        }
        
        // 创建按钮元素
        function createTriggerButtons() {
            triggerButtonsContainer.innerHTML = '';
            const pathPoints = getPathPoints();
            const totalPoints = pathPoints.length;
            
            for (let i = 0; i < 48; i++) {
                // 计算按钮在路径上的位置（均匀分布）
                const pathPos = (i / 47) * (totalPoints - 1);
                const pos = getPositionOnPath(pathPos);
                
                const btn = document.createElement('button');
                btn.className = 'trigger-btn';
                btn.dataset.id = i;
                btn.style.left = (pos.x * window.innerWidth) + 'px';
                btn.style.top = (pos.y * window.innerHeight) + 'px';
                btn.title = `按钮${i}号 (${buttonRanges[i].min.toFixed(1)}-${buttonRanges[i].max.toFixed(1)})`;
                
                btn.addEventListener('click', () => {
                    console.log(`触发按钮 ${i} 号，路径范围: ${buttonRanges[i].min.toFixed(1)} - ${buttonRanges[i].max.toFixed(1)}`);
                    if (i === 1 && canTriggerButton1) {
                        handleSpacePress();
                    } else {
                        alert(`触发机关 ${i} 号！`);
                    }
                });
                
                triggerButtonsContainer.appendChild(btn);
            }
        }
        
        // 检查当前路径索引触发了哪个按钮
        function checkTriggerButtons() {
            for (let i = 0; i < 48; i++) {
                const range = buttonRanges[i];
                const btn = document.querySelector(`.trigger-btn[data-id="${i}"]`);
                if (pathIndex >= range.min && pathIndex < range.max) {
                    btn.classList.add('active');
                    // 检查是否在1号按钮范围内
                    if (i === 1) {
                        canTriggerButton1 = true;
                    }
                } else {
                    btn.classList.remove('active');
                    if (i === 1) {
                        canTriggerButton1 = false;
                    }
                }
            }
        }
        
        // 播放A视频 (a2.mov)
        function playVideoA() {
            triggerVideo.src = 'a/a2%20.mov';
            triggerVideo.style.display = 'block';
            triggerVideo.play().catch(e => console.log('视频播放失败:', e));
            videoState = 1;
            isTriggerVideoPlaying = true;
        }
        
        // 播放B视频 (b2.mov)
        function playVideoB() {
            triggerVideo.src = 'b/b2.mov';
            triggerVideo.style.display = 'block';
            // 从上次中断位置继续播放
            triggerVideo.currentTime = videoBCurrentTime;
            triggerVideo.play().catch(e => console.log('视频播放失败:', e));
            videoState = 2;
            isTriggerVideoPlaying = true;
        }
        
        // 关闭视频
        function closeTriggerVideo() {
            triggerVideo.pause();
            triggerVideo.style.display = 'none';
            isTriggerVideoPlaying = false;
            videoState = 0;
            isLongPressingB = false;
        }
        
        // 处理空格键按下事件
        function handleSpacePress() {
            if (!canTriggerButton1) return;
            
            if (videoState === 0) {
                // 第一次空格，播放A视频
                playVideoA();
            } else if (videoState === 1) {
                // 第二次空格，切换到B视频（长按模式）
                isLongPressingB = true;
                playVideoB();
            } else if (videoState === 2) {
                // 已经在播放B视频，继续播放（长按保持）
                isLongPressingB = true;
            }
        }
        
        // 处理空格键松开事件
        function handleSpaceRelease() {
            if (videoState === 2 && isLongPressingB) {
                // 记录B视频当前播放位置
                videoBCurrentTime = triggerVideo.currentTime;
                // 松开空格，从B视频跳回A视频
                isLongPressingB = false;
                playVideoA();
            }
        }
        


        function updatePosition() {
            if (keys.w || keys.d) {
                pathIndex += config.speed;
            }
            if (keys.s || keys.a) {
                pathIndex -= config.speed;
            }
            
            pathIndex = Math.max(0, Math.min(getPathPoints().length - 1, pathIndex));
            
            const pos = getPositionOnPath(pathIndex);
            
            const screenX = pos.x * window.innerWidth;
            const screenY = pos.y * window.innerHeight;
            
            manImg.style.left = (screenX - manImg.offsetWidth/2) + 'px';
            manImg.style.top = (screenY - manImg.offsetHeight/2) + 'px';
            
            // D/W 前进时贴图向左（翻转），A/S 后退时贴图向右（不翻转）
            if (keys.d || keys.w) {
                manImg.style.transform = 'scaleX(-1)';
            } else if (keys.a || keys.s) {
                manImg.style.transform = 'scaleX(1)';
            }
            
            let statusText = `WASD移动 | 路径位置: ${pathIndex.toFixed(2)}`;
            if (canTriggerButton1) {
                if (videoState === 0) {
                    statusText += ' | [1号按钮] 按空格播放视频A';
                } else if (videoState === 1) {
                    statusText += ' | [1号按钮] 视频A播放中，再按空格切换视频B';
                } else if (videoState === 2) {
                    statusText += ' | [1号按钮] 视频B播放中（长按），松手返回视频A';
                }
                if (isTriggerVideoPlaying) {
                    statusText += ' | Alt键退出';
                }
            }
            status.textContent = statusText;
            
            // 检查按钮触发状态
            checkTriggerButtons();

            requestAnimationFrame(updatePosition);
        }

        // 事件监听
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            
            // Alt键退出视频播放
            if (key === 'alt' && isTriggerVideoPlaying) {
                e.preventDefault();
                closeTriggerVideo();
                return;
            }
            
            // 空格键触发1号按钮视频（当在1号按钮范围内时）
            if (key === ' ' && canTriggerButton1) {
                e.preventDefault();
                handleSpacePress();
                return;
            }
            
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
            }
        });

        document.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            
            // 空格键松开处理
            if (key === ' ') {
                handleSpaceRelease();
            }
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            createTriggerButtons();
        });

        // 右下角面板控制 - 带本地存储
        const miniLineWidth = document.getElementById('mini-line-width');
        const miniVideoSize = document.getElementById('mini-video-size');
        const miniVideoTop = document.getElementById('mini-video-top');
        
        // 从localStorage加载保存的设置
        function loadSettings() {
            const savedLineWidth = localStorage.getItem('lineWidth');
            const savedVideoSize = localStorage.getItem('videoSize');
            const savedVideoTop = localStorage.getItem('videoTop');
            
            if (savedLineWidth !== null) {
                config.lineWidth = parseInt(savedLineWidth);
                miniLineWidth.value = config.lineWidth;
                document.getElementById('mini-line-width-val').textContent = config.lineWidth + 'px';
            }
            
            if (savedVideoSize !== null) {
                const size = parseInt(savedVideoSize);
                miniVideoSize.value = size;
                document.getElementById('mini-video-size-val').textContent = size + '%';
                triggerVideo.style.height = size + '%';
            }
            
            if (savedVideoTop !== null) {
                const top = parseFloat(savedVideoTop);
                miniVideoTop.value = top;
                document.getElementById('mini-video-top-val').textContent = top + '%';
                triggerVideo.style.top = top + '%';
            }
        }
        
        miniLineWidth.addEventListener('input', (e) => {
            config.lineWidth = parseInt(e.target.value);
            document.getElementById('mini-line-width-val').textContent = config.lineWidth + 'px';
            localStorage.setItem('lineWidth', config.lineWidth);
            drawLine();
        });
        
        miniVideoSize.addEventListener('input', (e) => {
            const size = parseInt(e.target.value);
            document.getElementById('mini-video-size-val').textContent = size + '%';
            triggerVideo.style.height = size + '%';
            localStorage.setItem('videoSize', size);
        });
        
        miniVideoTop.addEventListener('input', (e) => {
            const top = parseFloat(e.target.value);
            document.getElementById('mini-video-top-val').textContent = top + '%';
            triggerVideo.style.top = top + '%';
            localStorage.setItem('videoTop', top);
        });

        // 初始化
        resizeCanvas();
        loadSettings(); // 加载保存的设置
        drawLine(); // 应用线条粗细
        createTriggerButtons();
        const initialPos = getPositionOnPath(pathIndex);
        manImg.style.left = (initialPos.x * window.innerWidth - manImg.offsetWidth/2) + 'px';
        manImg.style.top = (initialPos.y * window.innerHeight - manImg.offsetHeight/2) + 'px';

        updatePosition();
    </script>
</body>
</html>
