<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>键盘控制移动</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        #line-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #man-img { position: fixed; width: 5%; z-index: 10; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; z-index: 100; }
    </style>
</head>
<body>
    <video id="bg-video" style="width:100%;height:100%"></video>
    <canvas id="line-canvas"></canvas>
    <img src="white%20man.png_tmp" id="man-img">
    <div id="status">加载视频中...</div>

    <script>
        const manImg = document.getElementById('man-img');
        const status = document.getElementById('status');
        const bgVideo = document.getElementById('bg-video');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        // 设置canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawLine();
        }

        // 加载视频
        bgVideo.src = 'bg.mp4';
        bgVideo.loop = true;
        bgVideo.muted = true;

        bgVideo.oncanplay = function() {
            status.textContent = '视频已加载，点击开启声音';
            bgVideo.play().catch(e => console.log('播放失败:', e));
        };

        bgVideo.onerror = function() {
            status.textContent = '视频加载失败，尝试mov格式';
            bgVideo.src = 'bg.mov';
        };

        document.addEventListener('click', function() {
            bgVideo.muted = false;
            bgVideo.volume = 1;
            status.textContent = '声音已开启';
        });

        // 路径点数组 - 根据截图中的白线精确绘制
        // 白线范围：y 约 0.35-0.55，线条较细
        const pathPoints = [
            {x: 0.05, y: 0.45},
            {x: 0.08, y: 0.42},
            {x: 0.10, y: 0.38},
            {x: 0.12, y: 0.40},
            {x: 0.14, y: 0.46},
            {x: 0.16, y: 0.52},
            {x: 0.18, y: 0.55},
            {x: 0.20, y: 0.53},
            {x: 0.22, y: 0.48},
            {x: 0.24, y: 0.42},
            {x: 0.26, y: 0.36},
            {x: 0.28, y: 0.38},
            {x: 0.30, y: 0.44},
            {x: 0.32, y: 0.50},
            {x: 0.34, y: 0.55},
            {x: 0.36, y: 0.52},
            {x: 0.38, y: 0.47},
            {x: 0.40, y: 0.41},
            {x: 0.42, y: 0.36},
            {x: 0.44, y: 0.38},
            {x: 0.46, y: 0.43},
            {x: 0.48, y: 0.49},
            {x: 0.50, y: 0.54},
            {x: 0.52, y: 0.52},
            {x: 0.54, y: 0.47},
            {x: 0.56, y: 0.41},
            {x: 0.58, y: 0.37},
            {x: 0.60, y: 0.39},
            {x: 0.62, y: 0.44},
            {x: 0.64, y: 0.49},
            {x: 0.66, y: 0.52},
            {x: 0.68, y: 0.50},
            {x: 0.70, y: 0.47},
            {x: 0.75, y: 0.45},
            {x: 0.80, y: 0.46},
            {x: 0.85, y: 0.45},
            {x: 0.90, y: 0.46},
            {x: 0.95, y: 0.47}
        ];

        // 线条粗细（像素）
        const lineWidth = 4;

        // 绘制白线
        function drawLine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ffffff';
            ctx.const lineWidth = 4;  // 改成你想要的像素值lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            for (let i = 0; i < pathPoints.length; i++) {
                const x = pathPoints[i].x * canvas.width;
                const y = pathPoints[i].y * canvas.height;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        // 获取路径上某位置的坐标
        function getPositionOnPath(index) {
            const i = Math.max(0, Math.min(pathPoints.length - 1, Math.floor(index)));
            const nextI = Math.min(pathPoints.length - 1, i + 1);
            const t = index - i;
            
            const p1 = pathPoints[i];
            const p2 = pathPoints[nextI];
            
            return {
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            };
        }

        let pathIndex = 0;
        const speed = 0.05;
        const keys = { w: false, a: false, s: false, d: false };

        function updatePosition() {
            if (keys.w || keys.d) {
                pathIndex += speed;
            }
            if (keys.s || keys.a) {
                pathIndex -= speed;
            }
            
            pathIndex = Math.max(0, Math.min(pathPoints.length - 1, pathIndex));
            
            const pos = getPositionOnPath(pathIndex);
            
            const screenX = pos.x * window.innerWidth;
            const screenY = pos.y * window.innerHeight;
            
            manImg.style.left = (screenX - manImg.offsetWidth/2) + 'px';
            manImg.style.top = (screenY - manImg.offsetHeight/2) + 'px';
            
            if (keys.s || keys.a) {
                manImg.style.transform = 'scaleX(-1)';
            } else if (keys.w || keys.d) {
                manImg.style.transform = 'scaleX(1)';
            }
            
            status.textContent = `WASD移动 | 路径位置: ${pathIndex.toFixed(2)}`;

            requestAnimationFrame(updatePosition);
        }

        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        document.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        window.addEventListener('resize', resizeCanvas);

        // 初始化
        resizeCanvas();
        const initialPos = getPositionOnPath(pathIndex);
        manImg.style.left = (initialPos.x * window.innerWidth - manImg.offsetWidth/2) + 'px';
        manImg.style.top = (initialPos.y * window.innerHeight - manImg.offsetHeight/2) + 'px';

        updatePosition();
    </script>
</body>
</html>
