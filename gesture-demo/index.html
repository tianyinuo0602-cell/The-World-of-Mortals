<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>键盘控制移动</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        #line-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #man-img { position: fixed; width: 6%; z-index: 10; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; z-index: 100; }
        
        /* 右侧面板样式 */
        #control-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            padding: 20px;
            color: #fff;
            overflow-y: auto;
        }
        #control-panel h3 {
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            cursor: pointer;
        }
        .value-display {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <video id="bg-video" style="width:100%;height:100%"></video>
    <canvas id="line-canvas"></canvas>
    <img src="white%20man.png_tmp" id="man-img">
    <div id="status">加载视频中...</div>
    
    <!-- 控制面板 -->
    <div id="control-panel">
        <h3>调节面板</h3>
        
        <div class="control-group">
            <label>线条颜色</label>
            <input type="color" id="line-color" value="#ffffff">
        </div>
        
        <div class="control-group">
            <label>线条粗细</label>
            <input type="range" id="line-width" min="1" max="10" value="3">
            <span class="value-display" id="line-width-value">3px</span>
        </div>
        
        <div class="control-group">
            <label>小人大小</label>
            <input type="range" id="man-size" min="1" max="15" value="6">
            <span class="value-display" id="man-size-value">6%</span>
        </div>
        
        <div class="control-group">
            <label>移动速度</label>
            <input type="range" id="move-speed" min="1" max="10" value="2">
            <span class="value-display" id="move-speed-value">0.02</span>
        </div>
        
        <div class="control-group">
            <label>线条垂直位置</label>
            <input type="range" id="line-offset" min="-20" max="20" value="0">
            <span class="value-display" id="line-offset-value">0</span>
        </div>
    </div>

    <script>
        const manImg = document.getElementById('man-img');
        const status = document.getElementById('status');
        const bgVideo = document.getElementById('bg-video');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');
        
        // 控制面板元素
        const lineColorInput = document.getElementById('line-color');
        const lineWidthInput = document.getElementById('line-width');
        const manSizeInput = document.getElementById('man-size');
        const moveSpeedInput = document.getElementById('move-speed');
        const lineOffsetInput = document.getElementById('line-offset');
        
        // 显示值元素
        const lineWidthValue = document.getElementById('line-width-value');
        const manSizeValue = document.getElementById('man-size-value');
        const moveSpeedValue = document.getElementById('move-speed-value');
        const lineOffsetValue = document.getElementById('line-offset-value');

        // 设置canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawLine();
        }

        // 加载视频
        bgVideo.src = 'bg.mp4';
        bgVideo.loop = true;
        bgVideo.muted = true;

        bgVideo.oncanplay = function() {
            status.textContent = '视频已加载，点击开启声音';
            bgVideo.play().catch(e => console.log('播放失败:', e));
        };

        bgVideo.onerror = function() {
            status.textContent = '视频加载失败，尝试mov格式';
            bgVideo.src = 'bg.mov';
        };

        document.addEventListener('click', function() {
            bgVideo.muted = false;
            bgVideo.volume = 1;
            status.textContent = '声音已开启';
        });

        // 路径点数组
        const basePathPoints = [
            {x: 0.02, y: 0.50},
            {x: 0.04, y: 0.46},
            {x: 0.06, y: 0.42},
            {x: 0.08, y: 0.40},
            {x: 0.10, y: 0.42},
            {x: 0.12, y: 0.46},
            {x: 0.14, y: 0.52},
            {x: 0.16, y: 0.58},
            {x: 0.18, y: 0.62},
            {x: 0.20, y: 0.60},
            {x: 0.22, y: 0.54},
            {x: 0.24, y: 0.48},
            {x: 0.26, y: 0.42},
            {x: 0.28, y: 0.38},
            {x: 0.30, y: 0.40},
            {x: 0.32, y: 0.46},
            {x: 0.34, y: 0.54},
            {x: 0.36, y: 0.62},
            {x: 0.38, y: 0.68},
            {x: 0.40, y: 0.66},
            {x: 0.42, y: 0.58},
            {x: 0.44, y: 0.50},
            {x: 0.46, y: 0.42},
            {x: 0.48, y: 0.36},
            {x: 0.50, y: 0.38},
            {x: 0.52, y: 0.44},
            {x: 0.54, y: 0.52},
            {x: 0.56, y: 0.60},
            {x: 0.58, y: 0.66},
            {x: 0.60, y: 0.64},
            {x: 0.62, y: 0.56},
            {x: 0.64, y: 0.48},
            {x: 0.66, y: 0.42},
            {x: 0.68, y: 0.40},
            {x: 0.70, y: 0.44},
            {x: 0.72, y: 0.50},
            {x: 0.74, y: 0.56},
            {x: 0.76, y: 0.58},
            {x: 0.78, y: 0.56},
            {x: 0.80, y: 0.52},
            {x: 0.82, y: 0.48},
            {x: 0.84, y: 0.46},
            {x: 0.86, y: 0.48},
            {x: 0.88, y: 0.50},
            {x: 0.90, y: 0.52},
            {x: 0.92, y: 0.52},
            {x: 0.94, y: 0.50},
            {x: 0.96, y: 0.48},
            {x: 0.98, y: 0.50}
        ];

        // 当前配置
        let config = {
            lineColor: '#ffffff',
            lineWidth: 3,
            manSize: 6,
            speed: 0.02,
            lineOffset: 0
        };

        // 获取带偏移的路径点
        function getPathPoints() {
            const offset = config.lineOffset * 0.01;
            return basePathPoints.map(p => ({
                x: p.x,
                y: p.y + offset
            }));
        }

        // 绘制白线
        function drawLine() {
            const pathPoints = getPathPoints();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = config.lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            for (let i = 0; i < pathPoints.length; i++) {
                const x = pathPoints[i].x * canvas.width;
                const y = pathPoints[i].y * canvas.height;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        // 获取路径上某位置的坐标
        function getPositionOnPath(index) {
            const pathPoints = getPathPoints();
            const i = Math.max(0, Math.min(pathPoints.length - 1, Math.floor(index)));
            const nextI = Math.min(pathPoints.length - 1, i + 1);
            const t = index - i;
            
            const p1 = pathPoints[i];
            const p2 = pathPoints[nextI];
            
            return {
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            };
        }

        let pathIndex = 0;
        const keys = { w: false, a: false, s: false, d: false };

        function updatePosition() {
            if (keys.w || keys.d) {
                pathIndex += config.speed;
            }
            if (keys.s || keys.a) {
                pathIndex -= config.speed;
            }
            
            pathIndex = Math.max(0, Math.min(getPathPoints().length - 1, pathIndex));
            
            const pos = getPositionOnPath(pathIndex);
            
            const screenX = pos.x * window.innerWidth;
            const screenY = pos.y * window.innerHeight;
            
            manImg.style.left = (screenX - manImg.offsetWidth/2) + 'px';
            manImg.style.top = (screenY - manImg.offsetHeight/2) + 'px';
            
            if (keys.s || keys.a) {
                manImg.style.transform = 'scaleX(-1)';
            } else if (keys.w || keys.d) {
                manImg.style.transform = 'scaleX(1)';
            }
            
            status.textContent = `WASD移动 | 路径位置: ${pathIndex.toFixed(2)}`;

            requestAnimationFrame(updatePosition);
        }

        // 事件监听
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        document.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        window.addEventListener('resize', resizeCanvas);

        // 控制面板事件
        lineColorInput.addEventListener('input', (e) => {
            config.lineColor = e.target.value;
            drawLine();
        });

        lineWidthInput.addEventListener('input', (e) => {
            config.lineWidth = parseInt(e.target.value);
            lineWidthValue.textContent = config.lineWidth + 'px';
            drawLine();
        });

        manSizeInput.addEventListener('input', (e) => {
            config.manSize = parseInt(e.target.value);
            manSizeValue.textContent = config.manSize + '%';
            manImg.style.width = config.manSize + '%';
        });

        moveSpeedInput.addEventListener('input', (e) => {
            config.speed = parseInt(e.target.value) * 0.01;
            moveSpeedValue.textContent = config.speed.toFixed(2);
        });

        lineOffsetInput.addEventListener('input', (e) => {
            config.lineOffset = parseInt(e.target.value);
            lineOffsetValue.textContent = config.lineOffset;
            drawLine();
        });

        // 初始化
        resizeCanvas();
        const initialPos = getPositionOnPath(pathIndex);
        manImg.style.left = (initialPos.x * window.innerWidth - manImg.offsetWidth/2) + 'px';
        manImg.style.top = (initialPos.y * window.innerHeight - manImg.offsetHeight/2) + 'px';

        updatePosition();
    </script>
</body>
</html>
