<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>键盘控制 - 沿白线轨道移动</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        #line-img {
            position: fixed;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        #man-img {
            position: fixed;
            width: 5%;
            z-index: 10;
            transition: left 0.05s linear, top 0.05s linear;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            z-index: 100;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
        }
        #debug-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <video id="bg-video" style="width:100%;height:100%"></video>
    <img src="line.png" id="line-img" crossorigin="Anonymous">
    <img src="white man.png_tmp" id="man-img" crossorigin="Anonymous">
    <div id="status">加载中...</div>
    <canvas id="debug-canvas"></canvas>

    <script>
        (function() {
            // ----- DOM 元素 -----
            const bgVideo = document.getElementById('bg-video');
            const lineImg = document.getElementById('line-img');
            const manImg = document.getElementById('man-img');
            const statusDiv = document.getElementById('status');
            const debugCanvas = document.getElementById('debug-canvas');
            const ctx = debugCanvas.getContext('2d');

            // ----- 轨道相关变量 -----
            let trackPoints = [];     // 存储路径点 { x, y } (屏幕坐标)
            let currentIndex = 0;     // 当前所在路径点的索引
            let isTrackReady = false;

            // 键盘状态 (只用 W 和 S)
            const keys = { w: false, s: false };
            let lastMoveTime = 0;
            const moveCooldown = 80;   // 毫秒，控制移动速度

            // ----- 辅助函数：更新小人位置 -----
            function updateManPosition() {
                if (!isTrackReady || trackPoints.length === 0) return;
                const point = trackPoints[currentIndex];
                if (point) {
                    manImg.style.left = (point.x - manImg.offsetWidth / 2) + 'px';
                    manImg.style.top = (point.y - manImg.offsetHeight / 2) + 'px';
                }
            }

            // ----- 键盘驱动移动（沿轨道）-----
            function handleKeyboardMove(now) {
                if (!isTrackReady || trackPoints.length === 0) return;

                let newIndex = currentIndex;

                if (keys.w) {
                    newIndex = currentIndex + 1;
                } else if (keys.s) {
                    newIndex = currentIndex - 1;
                } else {
                    return; // 没有按 W/S
                }

                // 边界限制
                if (newIndex >= 0 && newIndex < trackPoints.length) {
                    currentIndex = newIndex;
                    updateManPosition();
                    updateStatusText();
                }
            }

            // 定时器轮询键盘输入（比 requestAnimationFrame 更可控）
            function startMoveLoop() {
                setInterval(() => {
                    const now = Date.now();
                    if (keys.w || keys.s) {
                        handleKeyboardMove(now);
                    }
                }, moveCooldown);
            }

            // ----- 提取 line.png 中的白线并排序成路径 -----
            function extractWhiteLinePath() {
                return new Promise((resolve, reject) => {
                    // 等待图片真正加载完成
                    if (!lineImg.complete) {
                        lineImg.onload = () => processImage();
                        return;
                    }
                    processImage();

                    function processImage() {
                        // 创建 canvas 读取像素
                        const imgCanvas = document.createElement('canvas');
                        const imgCtx = imgCanvas.getContext('2d');
                        imgCanvas.width = lineImg.naturalWidth;
                        imgCanvas.height = lineImg.naturalHeight;
                        
                        try {
                            imgCtx.drawImage(lineImg, 0, 0);
                            const imageData = imgCtx.getImageData(0, 0, imgCanvas.width, imgCanvas.height);
                            const data = imageData.data;
                            
                            // 提取白色点 (R>200, G>200, B>200)
                            const whitePoints = [];
                            for (let y = 0; y < imgCanvas.height; y++) {
                                for (let x = 0; x < imgCanvas.width; x++) {
                                    const idx = (y * imgCanvas.width + x) * 4;
                                    const r = data[idx];
                                    const g = data[idx+1];
                                    const b = data[idx+2];
                                    if (r > 200 && g > 200 && b > 200) {
                                        whitePoints.push({ x, y });
                                    }
                                }
                            }
                            
                            if (whitePoints.length === 0) {
                                statusDiv.textContent = '错误：未检测到白线，请检查 line.png';
                                reject(new Error('No white points'));
                                return;
                            }
                            
                            // 将白点排序成连续路径（最近邻算法，简单但有效）
                            const sorted = sortPointsByNearestNeighbor(whitePoints);
                            
                            // 可选：降采样，避免路径点太密集
                            const step = Math.max(1, Math.floor(sorted.length / 500)); // 最多保留500个点
                            const downsampled = sorted.filter((_, i) => i % step === 0);
                            
                            // 将图像坐标映射到屏幕坐标
                            const imgRect = lineImg.getBoundingClientRect();
                            const scaleX = imgRect.width / imgCanvas.width;
                            const scaleY = imgRect.height / imgCanvas.height;
                            const screenPoints = downsampled.map(p => ({
                                x: p.x * scaleX + imgRect.left,
                                y: p.y * scaleY + imgRect.top
                            }));
                            
                            trackPoints = screenPoints;
                            isTrackReady = true;
                            currentIndex = 0;  // 从起点开始
                            updateManPosition();
                            
                            // 可选：在 debug canvas 上绘制路径（绿线）
                            drawDebugPath(trackPoints);
                            
                            statusDiv.textContent = `轨道加载完成，共 ${trackPoints.length} 个路径点。使用 W/S 沿白线移动`;
                            resolve(trackPoints);
                        } catch (err) {
                            statusDiv.textContent = '读取图片像素失败，请确保通过本地服务器运行 (http://)';
                            reject(err);
                        }
                    }
                });
            }

            // 最近邻排序（将散乱的点连成一条线）
            function sortPointsByNearestNeighbor(points) {
                if (points.length === 0) return [];
                const remaining = [...points];
                const sorted = [remaining.shift()];
                
                while (remaining.length > 0) {
                    const last = sorted[sorted.length - 1];
                    let nearestIdx = 0;
                    let minDist = Infinity;
                    for (let i = 0; i < remaining.length; i++) {
                        const d = Math.hypot(last.x - remaining[i].x, last.y - remaining[i].y);
                        if (d < minDist) {
                            minDist = d;
                            nearestIdx = i;
                        }
                    }
                    sorted.push(remaining[nearestIdx]);
                    remaining.splice(nearestIdx, 1);
                }
                return sorted;
            }

            // 绘制调试路径（绿色线条）
            function drawDebugPath(points) {
                if (!debugCanvas || points.length < 2) return;
                debugCanvas.width = window.innerWidth;
                debugCanvas.height = window.innerHeight;
                ctx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
                ctx.beginPath();
                ctx.strokeStyle = 'lime';
                ctx.lineWidth = 2;
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
                // 画出起点和终点
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(points[0].x, points[0].y, 5, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle = 'blue';
                ctx.beginPath();
                ctx.arc(points[points.length-1].x, points[points.length-1].y, 5, 0, 2*Math.PI);
                ctx.fill();
            }

            // 更新状态文字（显示当前位置）
            function updateStatusText() {
                if (isTrackReady && trackPoints.length > 0) {
                    statusDiv.innerHTML = `🧍 沿白线移动 (W前进/S后退) | 第 ${currentIndex+1} / ${trackPoints.length} 点`;
                } else {
                    statusDiv.innerHTML = `⏳ 轨道加载中...`;
                }
            }

            // 窗口缩放时，重新计算所有路径点的屏幕坐标
            function recalcScreenPoints() {
                if (!isTrackReady || trackPoints.length === 0) return;
                const imgRect = lineImg.getBoundingClientRect();
                // 注意：我们需要保留原始图像坐标（相对于原图），所以必须保存一份原始点
                // 简单起见，我们重新提取一次？但为了效率，可以在最初保存原始图像坐标
                // 为了代码清晰，这里先不做动态缩放处理，建议页面尺寸固定。
                // 更好的做法：在初始化时保存 rawPoints，然后 resize 时重新映射。
                // 但为了演示简洁，用户刷新页面即可适应新尺寸。
                statusDiv.innerHTML += ' | 窗口大小变化，请刷新页面重新加载路径。';
            }

            // ----- 背景视频逻辑（和你原有的一样）-----
            bgVideo.src = 'bg.mp4';
            bgVideo.loop = true;
            bgVideo.muted = true;
            bgVideo.oncanplay = function() {
                statusDiv.innerHTML = '视频已加载，点击任意位置开启声音';
                bgVideo.play().catch(e => console.log);
            };
            bgVideo.onerror = function() {
                bgVideo.src = 'bg.mov';
            };
            document.addEventListener('click', function() {
                bgVideo.muted = false;
                bgVideo.volume = 1;
            });
            
            // ----- 初始化流程 -----
            async function init() {
                // 等待 line.png 加载完成（确保自然尺寸可用）
                if (!lineImg.complete) {
                    await new Promise(r => { lineImg.onload = r; });
                }
                // 提取白线路径
                await extractWhiteLinePath().catch(err => console.error(err));
                // 启动键盘监听
                startMoveLoop();
                // 窗口大小变化时提醒用户刷新（简单处理）
                window.addEventListener('resize', () => {
                    statusDiv.innerHTML += ' | 窗口大小改变，路径可能错位，请按 F5 刷新';
                });
                updateStatusText();
            }
            
            // 键盘事件
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w') {
                    e.preventDefault();
                    keys.w = true;
                } else if (key === 's') {
                    e.preventDefault();
                    keys.s = true;
                }
            });
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w') keys.w = false;
                if (key === 's') keys.s = false;
            });
            
            // 启动
            init();
        })();
    </script>
</body>
</html>
