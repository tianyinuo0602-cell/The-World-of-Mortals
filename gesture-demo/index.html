<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>键盘控制移动</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        #trigger-video {
            position: fixed;
            height: 33%;
            width: auto;
            aspect-ratio: 1/1;
            top: 23.6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            display: none;
            object-fit: cover;
        }
        #line-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        #man-img { position: fixed; width: 6%; z-index: 10; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; z-index: 100; }
        
        /* 触发按钮样式 */
        .trigger-btn {
            position: fixed;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0);
            border: none;
            cursor: pointer;
            z-index: 3;
            transform: translate(-50%, -50%);
        }
        .trigger-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .trigger-btn.active {
            background: rgba(255, 0, 0, 0.5);
        }
        
        /* 右下角调节面板 */
        #mini-panel {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 200px;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            padding: 15px;
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
        }
        #mini-panel h4 {
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            font-size: 13px;
        }
        .mini-control {
            margin-bottom: 10px;
        }
        .mini-control label {
            display: block;
            margin-bottom: 3px;
        }
        .mini-control input[type="range"] {
            width: 100%;
        }
        .mini-value {
            font-size: 10px;
            color: #aaa;
        }
    </style>
</head>

    <script>
        const manImg = document.getElementById('man-img');
        const status = document.getElementById('status');
        const bgVideo = document.getElementById('bg-video');
        const canvas = document.getElementById('line-canvas');
        const ctx = canvas.getContext('2d');

        // 设置canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawLine();
        }

        // 加载视频
        bgVideo.src = 'bg.mp4';
        bgVideo.loop = true;
        bgVideo.muted = true;

        bgVideo.oncanplay = function() {
            status.textContent = '视频已加载，点击开启声音';
            bgVideo.play().catch(e => console.log('播放失败:', e));
        };

        bgVideo.onerror = function() {
            status.textContent = '视频加载失败，尝试mov格式';
            bgVideo.src = 'bg.mov';
        };

        document.addEventListener('click', function() {
            bgVideo.muted = false;
            bgVideo.volume = 0.3;
            status.textContent = '声音已开启';
        });

        // 路径点数组（17个按钮对应17个路径点 - Y轴数值缩小，线条更平缓）
        const basePathPoints = [
            {x: 0.02, y: 0.50},  // 0号按钮
            {x: 0.08, y: 0.42},  // 1号按钮
            {x: 0.14, y: 0.55},  // 2号按钮
            {x: 0.20, y: 0.60},  // 3号按钮
            {x: 0.26, y: 0.40},  // 4号按钮
            {x: 0.32, y: 0.58},  // 5号按钮
            {x: 0.38, y: 0.62},  // 6号按钮
            {x: 0.44, y: 0.38},  // 7号按钮
            {x: 0.50, y: 0.52},  // 8号按钮
            {x: 0.56, y: 0.60},  // 9号按钮
            {x: 0.62, y: 0.42},  // 10号按钮
            {x: 0.68, y: 0.55},  // 11号按钮
            {x: 0.74, y: 0.48},  // 12号按钮
            {x: 0.80, y: 0.54},  // 13号按钮
            {x: 0.86, y: 0.44},  // 14号按钮
            {x: 0.92, y: 0.50},  // 15号按钮
            {x: 0.98, y: 0.48}   // 16号按钮
        ];

        // 当前配置
        let config = {
            lineColor: '#ffffff',
            lineWidth: 3,
            manSize: 6,
            speed: 0.02,
            lineOffset: 0,
            lineSlope: 0,
            lineScale: 100
        };

        // 获取带变换的路径点
        function getPathPoints() {
            const offset = config.lineOffset * 0.01;
            const slope = config.lineSlope * 0.01; // 坡度因子
            const scale = config.lineScale / 100; // 缩放比例
            
            // 计算中心点用于缩放
            const centerY = 0.5;
            
            return basePathPoints.map(p => {
                // 先应用缩放
                let y = centerY + (p.y - centerY) * scale;
                // 再应用坡度（x越大，y变化越大）
                y += p.x * slope;
                // 最后应用垂直偏移
                y += offset;
                
                return {
                    x: p.x,
                    y: y
                };
            });
        }

        // 获取曲线上的点（使用Catmull-Rom样条转换为贝塞尔曲线）
        function getCurvePoint(points, t) {
            const n = points.length - 1;
            
            // 处理边界情况
            if (t <= 0) return points[0];
            if (t >= n) return points[n];
            
            const i = Math.min(Math.floor(t), n - 1);
            const localT = t - i;
            
            const p0 = points[Math.max(0, i - 1)];
            const p1 = points[i];
            const p2 = points[Math.min(n, i + 1)];
            const p3 = points[Math.min(n, i + 2)];
            
            // Catmull-Rom样条插值
            const tt = localT * localT;
            const ttt = tt * localT;
            
            return {
                x: 0.5 * ((2 * p1.x) +
                         (-p0.x + p2.x) * localT +
                         (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * tt +
                         (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * ttt),
                y: 0.5 * ((2 * p1.y) +
                         (-p0.y + p2.y) * localT +
                         (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * tt +
                         (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * ttt)
            };
        }

        // 绘制白线（使用Catmull-Rom样条使线条圆滑且凌乱）
        function drawLine() {
            const pathPoints = getPathPoints();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = config.lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 转换坐标函数（应用缩放）
            const transform = (p) => ({
                x: (centerX + (p.x - centerX) * lineScaleFactor) * canvas.width,
                y: (centerY + (p.y - centerY) * lineScaleFactor) * canvas.height
            });
            
            const points = pathPoints.map(transform);
            
            if (points.length < 2) return;
            
            ctx.beginPath();
            
            // 使用Catmull-Rom样条绘制圆滑曲线
            const steps = 50; // 每段曲线的细分步数
            
            for (let i = 0; i <= (points.length - 1) * steps; i++) {
                const t = i / steps;
                const pos = getCurvePoint(points, t);
                
                if (i === 0) {
                    ctx.moveTo(pos.x, pos.y);
                } else {
                    ctx.lineTo(pos.x, pos.y);
                }
            }
            
            ctx.stroke();
        }

        // 获取路径上某位置的坐标（使用与绘制相同的曲线计算）
        function getPositionOnPath(index) {
            const pathPoints = getPathPoints();
            
            // 使用相同的Catmull-Rom样条计算位置
            const pos = getCurvePoint(pathPoints, index);
            
            return pos;
        }

        let videoB2CurrentTime = 0; // 记录2号按钮B视频上次播放的中断位置

        let videoB14CurrentTime = 0; // 记录14号按钮B视频上次播放的中断位置
        let videoB15CurrentTime = 0; // 记录15号按钮B视频上次播放的中断位置
        let videoB16CurrentTime = 0; // 记录16号按钮B视频上次播放的中断位置

        // 创建17个触发按钮（0-16）
        const triggerButtonsContainer = document.getElementById('trigger-buttons');
        const buttonRanges = [];
        
        // 生成按钮范围：0号(0-0.5), 1号(0.5-1.5), 2号(1.5-2.5)... 16号(15.5-16.5)
        for (let i = 0; i < 17; i++) {
            let min, max;
            if (i === 0) {
                min = 0;
                max = 0.5;
            } else {
                min = i - 0.5;
                max = i + 0.5;
            }
            buttonRanges.push({ min, max, id: i });
        }
        
        // 全局线条缩放比例（1.2倍放大）
        const lineScaleFactor = 0.6;
        const centerX = 0.5;
        const centerY = 0.5;
        
        // 创建按钮元素
        function createTriggerButtons() {
            triggerButtonsContainer.innerHTML = '';
            
            for (let i = 0; i < 17; i++) {
                // 按钮位置使用曲线上的位置（与人物贴纸一致）
                const pos = getPositionOnPath(i);
                const scaledX = centerX + (pos.x - centerX) * lineScaleFactor;
                const scaledY = centerY + (pos.y - centerY) * lineScaleFactor;
                
                const btn = document.createElement('button');
                btn.className = 'trigger-btn';
                btn.dataset.id = i;
                btn.style.left = (scaledX * window.innerWidth) + 'px';
                btn.style.top = (scaledY * window.innerHeight) + 'px';
                btn.title = `按钮${i}号 (${buttonRanges[i].min.toFixed(1)}-${buttonRanges[i].max.toFixed(1)})`;
                
                btn.addEventListener('click', () => {
                    console.log(`触发按钮 ${i} 号，路径范围: ${buttonRanges[i].min.toFixed(1)} - ${buttonRanges[i].max.toFixed(1)}`);
                    if ((i === 1 && canTriggerButton1) || (i === 2 && canTriggerButton2) || (i === 3 && canTriggerButton3) || (i === 4 && canTriggerButton4) || (i === 5 && canTriggerButton5) || (i === 6 && canTriggerButton6) || (i === 7 && canTriggerButton7) || (i === 8 && canTriggerButton8) || (i === 9 && canTriggerButton9) || (i === 10 && canTriggerButton10) || (i === 11 && canTriggerButton11) || (i === 12 && canTriggerButton12) || (i === 13 && canTriggerButton13) || (i === 14 && canTriggerButton14) || (i === 15 && canTriggerButton15) || (i === 16 && canTriggerButton16)) {

                        handleSpacePress();
                    } else {

                    }
                });
                
                triggerButtonsContainer.appendChild(btn);
            }
        }
        
        // 检查当前路径索引触发了哪个按钮

            for (let i = 0; i < 17; i++) {
                const range = buttonRanges[i];
                const btn = document.querySelector(`.trigger-btn[data-id="${i}"]`);
                if (pathIndex >= range.min && pathIndex < range.max) {

        // 切换显示的视频元素（避免重新加载）
        function switchVideoElement(newVideoElement) {
            // 暂停当前播放的视频
            if (currentVideoElement && currentVideoElement !== newVideoElement) {
                currentVideoElement.pause();
                currentVideoElement.style.display = 'none';
            }
            // 显示新视频
            newVideoElement.style.display = 'block';
            newVideoElement.style.position = 'fixed';
            newVideoElement.style.height = triggerVideo.style.height || '33%';
            newVideoElement.style.width = 'auto';
            newVideoElement.style.aspectRatio = '1/1';
            newVideoElement.style.top = triggerVideo.style.top || '23.6%';
            newVideoElement.style.left = '50%';
            newVideoElement.style.transform = 'translateX(-50%)';
            newVideoElement.style.zIndex = '1';
            newVideoElement.style.objectFit = 'cover';
            newVideoElement.play().catch(e => console.log('视频播放失败:', e));
            currentVideoElement = newVideoElement;
        }

        // 播放A视频 (a2.mov, a2(2).mov, a3.mov 或 a4.mov)
        function playVideoA() {
            let targetVideo;
            if (currentActiveButton === 1) {
                targetVideo = videoA1;
            } else if (currentActiveButton === 2) {
                targetVideo = videoA2;
            } else if (currentActiveButton === 3) {
                targetVideo = videoA3;
            } else if (currentActiveButton === 4) {
                targetVideo = videoA4;
            } else if (currentActiveButton === 5) {
                targetVideo = videoA5;
            } else if (currentActiveButton === 6) {
                targetVideo = videoA6;
            } else if (currentActiveButton === 7) {
                targetVideo = videoA7;
            } else if (currentActiveButton === 8) {
                targetVideo = videoA8;
            } else if (currentActiveButton === 9) {
                targetVideo = videoA9;
            } else if (currentActiveButton === 10) {
                targetVideo = videoA10;
            } else if (currentActiveButton === 11) {
                targetVideo = videoA11;
            } else if (currentActiveButton === 12) {
                targetVideo = videoA12;
            } else if (currentActiveButton === 13) {
                targetVideo = videoA13;
            } else if (currentActiveButton === 14) {
                targetVideo = videoA14;
            } else if (currentActiveButton === 15) {
                targetVideo = videoA15;
            } else if (currentActiveButton === 16) {
                targetVideo = videoA16;
            }
            switchVideoElement(targetVideo);
            videoState = 1;
            isTriggerVideoPlaying = true;
        }

        // 播放B视频 (b1-b16)
        function playVideoB() {
            let targetVideo;
            if (currentActiveButton === 1) {
                targetVideo = videoB1;
                videoB1.currentTime = videoBCurrentTime;
            } else if (currentActiveButton === 2) {
                targetVideo = videoB2;
                videoB2.currentTime = videoB2CurrentTime;
            } else if (currentActiveButton === 3) {
                targetVideo = videoB3;
                videoB3.currentTime = videoB3CurrentTime;
            } else if (currentActiveButton === 4) {
                targetVideo = videoB4;
                videoB4.currentTime = videoB4CurrentTime;
            } else if (currentActiveButton === 5) {
                targetVideo = videoB5;
                videoB5.currentTime = videoB5CurrentTime;
            } else if (currentActiveButton === 6) {
                targetVideo = videoB6;
                videoB6.currentTime = videoB6CurrentTime;
            } else if (currentActiveButton === 7) {
                targetVideo = videoB7;
                videoB7.currentTime = videoB7CurrentTime;
            } else if (currentActiveButton === 8) {
                targetVideo = videoB8;
                videoB8.currentTime = videoB8CurrentTime;
            } else if (currentActiveButton === 9) {
                targetVideo = videoB9;
                videoB9.currentTime = videoB9CurrentTime;
            } else if (currentActiveButton === 10) {
                targetVideo = videoB10;
                videoB10.currentTime = videoB10CurrentTime;
            } else if (currentActiveButton === 11) {
                targetVideo = videoB11;
                videoB11.currentTime = videoB11CurrentTime;
            } else if (currentActiveButton === 12) {
                targetVideo = videoB12;
                videoB12.currentTime = videoB12CurrentTime;
            } else if (currentActiveButton === 13) {
                targetVideo = videoB13;
                videoB13.currentTime = videoB13CurrentTime;
            } else if (currentActiveButton === 14) {
                targetVideo = videoB14;
                videoB14.currentTime = videoB14CurrentTime;
            } else if (currentActiveButton === 15) {
                targetVideo = videoB15;
                videoB15.currentTime = videoB15CurrentTime;
            } else if (currentActiveButton === 16) {
                targetVideo = videoB16;
                videoB16.currentTime = videoB16CurrentTime;
            }
            switchVideoElement(targetVideo);
            videoState = 2;
            isTriggerVideoPlaying = true;
        }

        // 关闭视频
        function closeTriggerVideo() {
            if (currentVideoElement) {
                currentVideoElement.pause();
                currentVideoElement.style.display = 'none';
            }
            videoA1.style.display = 'none';
            videoB1.style.display = 'none';
            videoA2.style.display = 'none';
            videoB2.style.display = 'none';
            videoA3.style.display = 'none';
            videoB3.style.display = 'none';
            videoA4.style.display = 'none';
            videoB4.style.display = 'none';
            videoA5.style.display = 'none';
            videoB5.style.display = 'none';
            videoA6.style.display = 'none';
            videoB6.style.display = 'none';
            videoA7.style.display = 'none';
            videoB7.style.display = 'none';
            videoA8.style.display = 'none';
            videoB8.style.display = 'none';
            videoA9.style.display = 'none';
            videoB9.style.display = 'none';
            videoA10.style.display = 'none';
            videoB10.style.display = 'none';
            videoA11.style.display = 'none';
            videoB11.style.display = 'none';
            videoA12.style.display = 'none';
            videoB12.style.display = 'none';
            videoA13.style.display = 'none';
            videoB13.style.display = 'none';
            videoA14.style.display = 'none';
            videoB14.style.display = 'none';
            videoA15.style.display = 'none';
            videoB15.style.display = 'none';
            videoA16.style.display = 'none';
            videoB16.style.display = 'none';
            isTriggerVideoPlaying = false;
            videoState = 0;
            isLongPressingB = false;
            currentActiveButton = 0;
        }
        
        // 处理空格键按下事件
        function handleSpacePress() {
            if (!canTriggerButton1 && !canTriggerButton2 && !canTriggerButton3 && !canTriggerButton4 && !canTriggerButton5 && !canTriggerButton6 && !canTriggerButton7 && !canTriggerButton8 && !canTriggerButton9 && !canTriggerButton10 && !canTriggerButton11 && !canTriggerButton12 && !canTriggerButton13 && !canTriggerButton14 && !canTriggerButton15 && !canTriggerButton16) return;
            if (currentActiveButton === 0) return;

            if (videoState === 0) {
                // 第一次空格，播放A视频
                playVideoA();
            } else if (videoState === 1) {
                // 第二次空格，切换到B视频（长按模式）
                isLongPressingB = true;
                playVideoB();
            } else if (videoState === 2) {
                // 已经在播放B视频，继续播放（长按保持）
                isLongPressingB = true;
            }
        }

        // 处理空格键松开事件
        function handleSpaceRelease() {
            if (videoState === 2 && isLongPressingB) {
                // 记录B视频当前播放位置（根据当前激活的按钮）
                if (currentActiveButton === 1) {
                    videoBCurrentTime = videoB1.currentTime;
                } else if (currentActiveButton === 2) {
                    videoB2CurrentTime = videoB2.currentTime;
                } else if (currentActiveButton === 3) {
                    videoB3CurrentTime = videoB3.currentTime;
                } else if (currentActiveButton === 4) {
                    videoB4CurrentTime = videoB4.currentTime;
                } else if (currentActiveButton === 5) {
                    videoB5CurrentTime = videoB5.currentTime;
                } else if (currentActiveButton === 6) {
                    videoB6CurrentTime = videoB6.currentTime;
                } else if (currentActiveButton === 7) {
                    videoB7CurrentTime = videoB7.currentTime;
                } else if (currentActiveButton === 8) {
                    videoB8CurrentTime = videoB8.currentTime;
                } else if (currentActiveButton === 9) {
                    videoB9CurrentTime = videoB9.currentTime;
                } else if (currentActiveButton === 10) {
                    videoB10CurrentTime = videoB10.currentTime;
                } else if (currentActiveButton === 11) {
                    videoB11CurrentTime = videoB11.currentTime;
                } else if (currentActiveButton === 12) {
                    videoB12CurrentTime = videoB12.currentTime;
                } else if (currentActiveButton === 13) {
                    videoB13CurrentTime = videoB13.currentTime;
                } else if (currentActiveButton === 14) {
                    videoB14CurrentTime = videoB14.currentTime;
                } else if (currentActiveButton === 15) {
                    videoB15CurrentTime = videoB15.currentTime;
                } else if (currentActiveButton === 16) {
                    videoB16CurrentTime = videoB16.currentTime;
                }
                // 松开空格，从B视频跳回A视频
                isLongPressingB = false;
                playVideoA();
            }
        }
        


        function updatePosition() {
            if (keys.w || keys.d) {
                pathIndex += config.speed;
            }
            if (keys.s || keys.a) {
                pathIndex -= config.speed;
            }
            
            pathIndex = Math.max(0, Math.min(getPathPoints().length - 1, pathIndex));
            
            const pos = getPositionOnPath(pathIndex);
            
            // 应用与线条相同的缩放
            const scaledX = centerX + (pos.x - centerX) * lineScaleFactor;
            const scaledY = centerY + (pos.y - centerY) * lineScaleFactor;
            const screenX = scaledX * window.innerWidth;
            const screenY = scaledY * window.innerHeight;
            
            manImg.style.left = (screenX - manImg.offsetWidth/2) + 'px';
            manImg.style.top = (screenY - manImg.offsetHeight/2) + 'px';
            
            // D/W 前进时贴图向左（翻转），A/S 后退时贴图向右（不翻转）
            if (keys.d || keys.w) {
                manImg.style.transform = 'scaleX(-1)';
            } else if (keys.a || keys.s) {
                manImg.style.transform = 'scaleX(1)';
            }
            
            let statusText = `WASD移动 | 路径位置: ${pathIndex.toFixed(2)}`;
            const activeBtn = canTriggerButton1 ? 1 : (canTriggerButton2 ? 2 : (canTriggerButton3 ? 3 : (canTriggerButton4 ? 4 : (canTriggerButton5 ? 5 : (canTriggerButton6 ? 6 : (canTriggerButton7 ? 7 : (canTriggerButton8 ? 8 : (canTriggerButton9 ? 9 : (canTriggerButton10 ? 10 : (canTriggerButton11 ? 11 : (canTriggerButton12 ? 12 : (canTriggerButton13 ? 13 : (canTriggerButton14 ? 14 : (canTriggerButton15 ? 15 : (canTriggerButton16 ? 16 : 0)))))))))))))));
            if (activeBtn > 0) {
                if (videoState === 0) {
                    statusText += ` | [${activeBtn}号按钮] 按空格播放视频A`;
                } else if (videoState === 1) {
                    statusText += ` | [${activeBtn}号按钮] 视频A播放中，再按空格切换视频B`;
                } else if (videoState === 2) {
                    statusText += ` | [${activeBtn}号按钮] 视频B播放中（长按），松手返回视频A`;
                }
                if (isTriggerVideoPlaying) {
                    statusText += ' | Alt键退出';
                }
            }
            status.textContent = statusText;
            
            // 检查按钮触发状态
            checkTriggerButtons();

            requestAnimationFrame(updatePosition);
        }

        // 事件监听
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            
            // Alt键退出视频播放
            if (key === 'alt' && isTriggerVideoPlaying) {
                e.preventDefault();
                closeTriggerVideo();
                return;
            }
            
            // 空格键触发1号或2号按钮视频
            if (key === ' ' && (canTriggerButton1 || canTriggerButton2 || canTriggerButton3 || canTriggerButton4 || canTriggerButton5 || canTriggerButton6 || canTriggerButton7 || canTriggerButton8 || canTriggerButton9 || canTriggerButton10 || canTriggerButton11 || canTriggerButton12 || canTriggerButton13 || canTriggerButton14 || canTriggerButton15 || canTriggerButton16)) {
                e.preventDefault();
                if (canTriggerButton1) currentActiveButton = 1;
                else if (canTriggerButton2) currentActiveButton = 2;
                else if (canTriggerButton3) currentActiveButton = 3;
                else if (canTriggerButton4) currentActiveButton = 4;
                else if (canTriggerButton5) currentActiveButton = 5;
                else if (canTriggerButton6) currentActiveButton = 6;
                else if (canTriggerButton7) currentActiveButton = 7;
                else if (canTriggerButton8) currentActiveButton = 8;
                else if (canTriggerButton9) currentActiveButton = 9;
                else if (canTriggerButton10) currentActiveButton = 10;
                else if (canTriggerButton11) currentActiveButton = 11;
                else if (canTriggerButton12) currentActiveButton = 12;
                else if (canTriggerButton13) currentActiveButton = 13;
                else if (canTriggerButton14) currentActiveButton = 14;
                else if (canTriggerButton15) currentActiveButton = 15;
                else if (canTriggerButton16) currentActiveButton = 16;
                handleSpacePress();
                return;
            }
            
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
            }
        });

        document.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            
            // 空格键松开处理
            if (key === ' ') {
                handleSpaceRelease();
            }
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            createTriggerButtons();
        });

        // 右下角面板控制 - 带本地存储
        const miniLineWidth = document.getElementById('mini-line-width');
        const miniVideoSize = document.getElementById('mini-video-size');
        const miniVideoTop = document.getElementById('mini-video-top');
        
        // 从localStorage加载保存的设置
        function loadSettings() {
            const savedLineWidth = localStorage.getItem('lineWidth');
            const savedVideoSize = localStorage.getItem('videoSize');
            const savedVideoTop = localStorage.getItem('videoTop');
            
            if (savedLineWidth !== null) {
                config.lineWidth = parseInt(savedLineWidth);
                miniLineWidth.value = config.lineWidth;
                document.getElementById('mini-line-width-val').textContent = config.lineWidth + 'px';
            }
            
            if (savedVideoSize !== null) {
                const size = parseInt(savedVideoSize);
                miniVideoSize.value = size;
                document.getElementById('mini-video-size-val').textContent = size + '%';
            // 应用到所有视频元素
            [triggerVideo, videoA1, videoB1, videoA2, videoB2, videoA3, videoB3, videoA4, videoB4, videoA5, videoB5, videoA6, videoB6, videoA7, videoB7, videoA8, videoB8, videoA9, videoB9, videoA10, videoB10, videoA11, videoB11, videoA12, videoB12, videoA13, videoB13, videoA14, videoB14, videoA15, videoB15, videoA16, videoB16].forEach(v => {
                if (v) v.style.height = size + '%';
            });
            }

            if (savedVideoTop !== null) {
                const top = parseFloat(savedVideoTop);
                miniVideoTop.value = top;
                document.getElementById('mini-video-top-val').textContent = top + '%';
                // 应用到所有视频元素
            [triggerVideo, videoA1, videoB1, videoA2, videoB2, videoA3, videoB3, videoA4, videoB4, videoA5, videoB5, videoA6, videoB6, videoA7, videoB7, videoA8, videoB8, videoA9, videoB9, videoA10, videoB10, videoA11, videoB11, videoA12, videoB12, videoA13, videoB13, videoA14, videoB14, videoA15, videoB15, videoA16, videoB16].forEach(v => {
                if (v) v.style.top = top + '%';
            });
            }
        }

        miniLineWidth.addEventListener('input', (e) => {
            config.lineWidth = parseInt(e.target.value);
            document.getElementById('mini-line-width-val').textContent = config.lineWidth + 'px';
            localStorage.setItem('lineWidth', config.lineWidth);
            drawLine();
        });

        miniVideoSize.addEventListener('input', (e) => {
            const size = parseInt(e.target.value);
            document.getElementById('mini-video-size-val').textContent = size + '%';
            // 应用到所有视频元素
            [triggerVideo, videoA1, videoB1, videoA2, videoB2, videoA3, videoB3, videoA4, videoB4, videoA5, videoB5, videoA6, videoB6, videoA7, videoB7, videoA8, videoB8, videoA9, videoB9, videoA10, videoB10, videoA11, videoB11, videoA12, videoB12, videoA13, videoB13, videoA14, videoB14, videoA15, videoB15, videoA16, videoB16].forEach(v => {
                if (v) v.style.height = size + '%';
            });
            localStorage.setItem('videoSize', size);
        });

        miniVideoTop.addEventListener('input', (e) => {
            const top = parseFloat(e.target.value);
            document.getElementById('mini-video-top-val').textContent = top + '%';
            // 应用到所有视频元素
            [triggerVideo, videoA1, videoB1, videoA2, videoB2, videoA3, videoB3, videoA4, videoB4, videoA5, videoB5, videoA6, videoB6, videoA7, videoB7, videoA8, videoB8, videoA9, videoB9, videoA10, videoB10, videoA11, videoB11, videoA12, videoB12, videoA13, videoB13, videoA14, videoB14, videoA15, videoB15, videoA16, videoB16].forEach(v => {
                if (v) v.style.top = top + '%';
            });
            localStorage.setItem('videoTop', top);
        });

        // 初始化
        resizeCanvas();
        loadSettings(); // 加载保存的设置
        drawLine(); // 应用线条粗细
        createTriggerButtons();
        const initialPos = getPositionOnPath(pathIndex);
        const initialScaledX = centerX + (initialPos.x - centerX) * lineScaleFactor;
        const initialScaledY = centerY + (initialPos.y - centerY) * lineScaleFactor;
        manImg.style.left = (initialScaledX * window.innerWidth - manImg.offsetWidth/2) + 'px';
        manImg.style.top = (initialScaledY * window.innerHeight - manImg.offsetHeight/2) + 'px';

        updatePosition();
    </script>
</body>
</html>
